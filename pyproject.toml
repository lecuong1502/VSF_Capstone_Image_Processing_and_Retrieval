[project]
name = "vsf-pipeline"
version = "0.1.0"
description = "Offline pipeline and evaluation for Vietnamese travel image moderation and retrieval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/search"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pipeline", "eval", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
