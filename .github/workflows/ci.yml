name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job `name:`s are required status checks in main's branch protection –
# renaming a job means updating the protection rule too.
jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - run: make sync
      - run: make lint-py
      - run: make test-py

  go:
    name: Go (gofmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/gateway/go.mod
          # Switch to services/gateway/go.sum once the gateway has dependencies.
          cache-dependency-path: services/gateway/go.mod
      - run: make lint-go
      - run: make test-go

  web:
    name: Web (eslint, prettier, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - run: make lint-web
      - run: make test-web
      - run: make build-web
